<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkpoint &mdash; Rollback Execution Result</title>
    <style>
        :root {
            --bg-body: #070a12;
            --bg-card: #111827;
            --border: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --success: #10b981;
            --failure: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .result-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            max-width: 480px;
            width: 100%;
            padding: 36px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .status-icon {
            width: 56px;
            height: 56px;
            margin-bottom: 16px;
        }

        h2.success { color: var(--success); }
        h2.failure { color: var(--failure); }

        p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
            margin: 16px 0 24px;
        }

        .action-link {
            display: inline-block;
            background: #2563eb;
            color: #fff;
            padding: 9px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 600;
            transition: background 0.15s;
        }
        .action-link:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="result-card">
        {% if success %}
        <svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <h2 class="success">Rollback Successful</h2>
        {% else %}
        <svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="var(--failure)" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="15" y1="9" x2="9" y2="15"></line>
            <line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
        <h2 class="failure">Rollback Failed</h2>
        {% endif %}

        <p>{{ message }}</p>

        <a class="action-link" href="{{ url_for('checkpoints') }}">&larr; Return to Rollback History</a>
    </div>
</body>
</html>
