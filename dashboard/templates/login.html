<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkpoint &mdash; SOC Authentication Gateway</title>
    <style>
        :root {
            --bg-body: #070a12;
            --bg-card: #111827;
            --bg-subtle: #0d1322;
            --border: #1e293b;
            --border-hover: #334155;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.2);
            --risk-crit: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            width: 380px;
            max-width: 100%;
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .auth-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #2563eb, var(--primary), #2563eb);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            stroke: var(--primary);
            stroke-width: 2;
            fill: none;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 8px var(--primary-glow));
        }

        .brand-name {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #fff;
            margin-bottom: 6px;
        }

        .brand-tagline {
            font-size: 12.5px;
            color: var(--text-muted);
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.15s ease;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-glow);
        }

        button {
            width: 100%;
            padding: 11px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
            margin-top: 8px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 12.5px;
            margin-bottom: 18px;
            text-align: center;
        }

        .auth-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 11.5px;
            color: var(--text-dim);
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="brand-header">
                <svg class="brand-icon" viewBox="0 0 24 24">
                    <path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z"></path>
                    <path d="M12 7v10"></path>
                    <path d="M8 12l4 4 4-4"></path>
                </svg>
                <div class="brand-name">CHECKPOINT SOC</div>
                <div class="brand-tagline">Runtime Security Layer for Autonomous Agents</div>
            </div>

            {% if error %}
            <div class="error-message">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/login">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="field">
                    <label for="username">Operator Username</label>
                    <input type="text" id="username" name="username" required autofocus autocomplete="username" placeholder="admin">
                </div>
                <div class="field">
                    <label for="password">Password / Passphrase</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
                </div>
                <button type="submit">Sign In to Dashboard &rarr;</button>
            </form>
        </div>

        <div class="auth-footer">
            Protected by Argon2id Session Tokens &bull; Rate Limited<br>
            Notice: Operating in Development Mode (Workspace Storage)
        </div>
    </div>
</body>
</html>
